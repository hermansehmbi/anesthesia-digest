name: Anesthesia Digest

on:
  schedule:
    # Monday & Thursday 11:00 UTC (7:00 AM ET summer)
    - cron: '0 11 * * 1,4'
    # Saturday 12:00 UTC (8:00 AM ET)
    - cron: '0 12 * * 6'
    # 1st of each month 13:00 UTC (9:00 AM ET)
    - cron: '0 13 1 * *'

  workflow_dispatch:
    inputs:
      command:
        description: 'Which email to send'
        required: true
        default: 'digest'
        type: choice
        options: [digest, saturday, monthly]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Needed so the digest run can commit the published podcast episode +
    # player page to /docs and push it for GitHub Pages.
    permissions:
      contents: write

    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      SENDER_EMAIL: ${{ secrets.GMAIL_ADDRESS }}
      # Pages URL is derived from the repo context — no username hardcoded.
      GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for publishing
        run: |
          git config user.name "Anesthesia Digest Bot"
          git config user.email "anesthesia-digest@users.noreply.github.com"

      - name: Restore article cache
        uses: actions/cache@v4
        with:
          path: articles_cache.json
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: Restore MOC tracker
        uses: actions/cache@v4
        with:
          path: moc_tracker.xlsx
          key: moc-${{ github.run_id }}
          restore-keys: moc-

      - name: Determine command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "command=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          else
            DAY=$(date -u +%u)
            DOM=$(date -u +%d)
            HOUR=$(date -u +%H)
            if [ "$DOM" = "01" ] && [ "$HOUR" -ge 13 ]; then
              echo "command=monthly" >> $GITHUB_OUTPUT
            elif [ "$DAY" = "6" ]; then
              echo "command=saturday" >> $GITHUB_OUTPUT
            else
              echo "command=digest" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run
        run: python main.py ${{ steps.cmd.outputs.command }}

      - name: Save article cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: articles_cache.json
          key: cache-${{ github.run_id }}

      - name: Save MOC tracker
        if: always()
        uses: actions/cache/save@v4
        with:
          path: moc_tracker.xlsx
          key: moc-${{ github.run_id }}
