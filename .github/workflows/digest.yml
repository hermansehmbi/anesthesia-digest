name: Anesthesia Digest

on:
  schedule:
    # 1st of each month, 11:00 UTC (7:00 AM ET summer) — the monthly digest
    # (email + podcast + Deep Dive).
    - cron: '0 11 1 * *'
    # 7th of each month, 11:00 UTC — the CME self-assessment (email + quiz page),
    # locked to the article set the digest published on the 1st (read from the
    # monday_featured.json / weekly_summaries.json committed to the repo below).
    - cron: '0 11 7 * *'
    # 25th of each month, 11:00 UTC — the monthly reconciliation email (top-5 +
    # MOC "fill in your hours" reminder) and Google Sheet / MOC summary refresh,
    # after the month's digest (1st) and self-assessment (7th) are both logged.
    - cron: '0 11 25 * *'

  workflow_dispatch:
    inputs:
      command:
        description: 'Which email to send'
        required: true
        default: 'digest'
        type: choice
        options: [digest, saturday, monthly]

jobs:
  run:
    runs-on: ubuntu-latest
    # Headroom for the heaviest run (the 1st: digest incl. podcast + Deep Dive).
    timeout-minutes: 30

    # Needed so the digest run can commit the published podcast episode +
    # player page to /docs and push it for GitHub Pages.
    permissions:
      contents: write

    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      SENDER_EMAIL: ${{ secrets.GMAIL_ADDRESS }}
      # Tier 1 live MOC tracking (optional — falls back to local xlsx if unset).
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      # Pages URL is derived from the repo context — no username hardcoded.
      GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg (required by pydub for the two-host audio mix)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for publishing
        run: |
          git config user.name "Anesthesia Digest Bot"
          git config user.email "anesthesia-digest@users.noreply.github.com"

      # Restore-only (no post-job auto-save) so the explicit Save steps below are
      # the single writer per key — avoids the "Cache save failed / unable to
      # reserve cache" collision from double-saving the same key.
      # monday_featured.json / weekly_summaries.json are NOT cached here — they
      # are committed to the repo (see "Persist digest state" below) so the CME
      # run (7th) always finds the digest's (1st) article set from a fresh
      # checkout, independent of the best-effort Actions cache. Only the bulky
      # optimization files stay in the cache.
      - name: Restore article cache
        uses: actions/cache/restore@v4
        with:
          path: |
            articles_cache.json
            fulltext_cache.json
            summaries_cache.json
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: Restore MOC tracker
        uses: actions/cache/restore@v4
        with:
          path: moc_tracker.xlsx
          key: moc-${{ github.run_id }}
          restore-keys: moc-

      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: send only the single email chosen in the dropdown.
            python main.py "${{ github.event.inputs.command }}"
          else
            DOM=$(date -u +%d)
            if [ "$DOM" = "07" ]; then
              # 7th of the month: the CME self-assessment. It reads ONLY the
              # month's featured articles + Deep Dive summaries the digest wrote
              # on the 1st (from the repo checkout) — no re-fetching.
              python main.py saturday
            elif [ "$DOM" = "25" ]; then
              # 25th of the month: the monthly reconciliation email + MOC /
              # Google Sheet summary refresh, once the month's digest (1st) and
              # self-assessment (7th) are both logged to the sheet.
              python main.py monthly
            else
              # 1st of the month: the digest fetches the month's articles and
              # writes monday_featured.json + the Deep Dive summaries, which the
              # 7th's CME run then reuses.
              python main.py digest
            fi
          fi

      # Commit the digest (1st) -> CME (7th) hand-off files to the repo so they
      # survive regardless of the Actions cache (which is best-effort and was
      # invalidated by a path-list change, breaking a CME run). The digest writes
      # these; the CME run reads them from the checkout. Best-effort: a failure
      # here never fails the run (the email already sent in "Run").
      - name: Persist digest state (digest -> CME handoff)
        if: success()
        continue-on-error: true
        run: |
          git add -f monday_featured.json weekly_summaries.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No digest-state changes to commit."
          else
            git commit -m "Update digest state ($(date -u +%F)) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" \
                && git push origin "HEAD:${GITHUB_REF_NAME:-main}" && break
              echo "push attempt $i failed; retrying..."; sleep 5
            done
          fi

      - name: Save article cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            articles_cache.json
            fulltext_cache.json
            summaries_cache.json
          key: cache-${{ github.run_id }}

      - name: Save MOC tracker
        if: always()
        uses: actions/cache/save@v4
        with:
          path: moc_tracker.xlsx
          key: moc-${{ github.run_id }}
